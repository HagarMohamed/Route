  <!DOCTYPE html>
  <html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدبّر - إدارة أموالك بذكاء</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <div class="dashboard-layout">

      <!-- Right Sidebar -->
      <aside class="sidebar-wrapper">
        <div class="sidebar-logo">
          <div class="logo-icon-blue">
            <img src="img/icons/coins-solid-full.png" alt="مدبّر">
          </div>
          <div class="logo-txt-group">
            <h2>مدبّر</h2>
            <p>إدارة أموالك بذكاء</p>
          </div>
        </div>

        <ul class="sidebar-menu">
          <li><a href="#" class="menu-item active">
              <img src="img/icons/house-solid-full.png" alt="الصفحة الرئيسية" class="menu-icon">
              الصفحة الرئيسية</a></li>
          <li><a href="#" class="menu-item">
              <img src="img/icons/arrow-right-arrow-left-solid-full.png" alt="المعاملات" class="menu-icon">
              المعاملات</a></li>
          <li><a href="#" class="menu-item">
              <img src="img/icons/chart-pie-solid-full.png" alt="الميزانيات" class="menu-icon">
              الميزانيات</a></li>
          <li><a href="#" class="menu-item">
              <img src="img/icons/piggy-bank-solid.png" alt="المدخرات" class="menu-icon">
              المدخرات</a></li>
          <li><a href="#" class="menu-item">
              <img src="img/icons/file-invoice-dollar-solid-full.png" alt="الفواتير الشهرية" class="menu-icon">
              الفواتير الشهرية</a></li>
        </ul>

        <div class="quick-actions-section">
          <h3>إجراءات سريعة</h3>
          <div class="action-link-row">
            <a href="#" class="action-btn-item">
              <span class="action-icon-container bg-light-blue">
                <img src="img/icons/paper-plane-solid-full.png" alt="إرسال أموال" class="action-icon">
              </span>إرسال
              أموال
            </a>
          </div>
          <div class="action-link-row">
            <a href="#" class="action-btn-item">
              <span class="action-icon-container bg-light-green">
                <img src="img/icons/plus-solid-full.png" alt="إضافة أموال" class="action-icon">
              </span>إضافة أموال
            </a>
          </div>
          <div class="action-link-row">
            <a href="#" class="action-btn-item">
              <span class="action-icon-container bg-light-green">
                <img src="img/icons/receipt-solid-full.png" alt="دفع فاتورة " class="action-icon">
              </span>دفع فاتورة
            </a>
          </div>
          <div class="action-link-row">
            <a href="#" class="action-btn-item">
              <span class="action-icon-container bg-light-green">
                <img src="img/icons/chart-line-solid-full.png" alt=" استثمار" class="action-icon">
              </span>استثمار
            </a>
          </div>
        </div>
      </aside>


      <!-- Header -->
      <header class="dashboard-header-main">

       <div class="header-content-wrapper">
         <div class="header-brand-badge">
          <div class="badge-icon-box">
              <img src="img/icons/coins-solid-full.png" alt="مدبّر">
          </div>
          <div class="badge-text-group">
            <h3>مدبّر</h3>
            <p>إدارة أموالك بذكاء</p>
          </div>
          <span class="connection-status">
            <span class="green-dot">●</span> متصل
          </span>

        </div>

        <div class="header-actions-group">
         
          <!-- search button -->
          <button class="control-circle-btn">
            <svg class="control-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>



          <!-- notification button -->
          <div class="notification-wrapper">
            <button class="control-circle-btn">
              <svg class="control-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            </button>
            <span class="notification-badge-red">2</span>
          </div>

          <!-- user profile card -->
          <div class="user-profile-card">
            <div class="user-info-text">
              <h4>سيف أسامة</h4>
              <p>حساب مميز</p>
            </div>
            <img src="img/avatar-1.jpg" alt="سيف أسامة" class="user-avatar-img">
          </div>

          </div>
       </div>

        




      </header>

      


      





    </div>




  </body>

  </html>
